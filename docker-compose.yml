services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/breastcare.db
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-this-development-secret}
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - breastcare_data:/app/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  breastcare_data:
